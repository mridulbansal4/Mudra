name: Production health check

# Deployment to https://mudra.duckdns.org is done manually on the server.
# This workflow only checks that the live site and its services answer after a push.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  health:
    name: Live site and service health
    runs-on: ubuntu-latest
    steps:
      - name: Web app responds
        run: curl -fsS -o /dev/null -w "web %{http_code}\n" https://mudra.duckdns.org/

      - name: Deal engine and dependencies report ok
        run: |
          body=$(curl -fsS https://mudra.duckdns.org/api/v1/health)
          echo "$body" | head -c 600; echo
          echo "$body" | grep -q '"status":"ok"'
