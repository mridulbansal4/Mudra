  <!-- Inner datum ring -->
  <path d="M256 88C372.6 88 424 139.4 424 256C424 372.6 372.6 424 256 424C139.4 424 88 372.6 88 256C88 139.4 139.4 88 256 88Z" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3"/>

