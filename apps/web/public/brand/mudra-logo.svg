      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28"/>
    </radialGradient>
    <linearGradient id="arch" x1="156" y1="156" x2="356" y2="356" gradientUnits="userSpaceOnUse">
