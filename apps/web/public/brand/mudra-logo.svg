  <!-- Mudra M-Arch -->
  <path d="M156.6 341.7V206.6C156.6 170.9 191.5 158.6 216.9 184L256 223L295.1 184C320.5 158.6 355.4 170.9 355.4 206.6V341.7" stroke="url(#arch)" stroke-width="26.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Assay Keystone -->
  <path d="M256 254.2L291.7 296L256 337.8L220.3 296Z" fill="url(#key)"/>
  <path d="M256 257.6L279.3 285L256 278.2L232.7 285Z" fill="#ffffff" fill-opacity="0.45"/>
