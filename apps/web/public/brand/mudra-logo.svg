<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="stage" cx="256" cy="210" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#19191d"/>
      <stop offset="60%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>
    <linearGradient id="bg" x1="120" y1="64" x2="392" y2="448" gradientUnits="userSpaceOnUse">
