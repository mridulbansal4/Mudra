  <rect width="512" height="512" fill="url(#stage)"/>

  <!-- Monolith squircle -->
  <g filter="url(#shadow)">
    <path d="M256 64C389.7 64 448 122.3 448 256C448 389.7 389.7 448 256 448C122.3 448 64 389.7 64 256C64 122.3 122.3 64 256 64Z" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#clip)">
