plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nexconnchat'
version = '1.0.0'

android {
  namespace "expo.modules.nexconnchat"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Official Nexconn Android Chat SDK (Maven Central, mirrored at maven.nexconn.ai).
  implementation 'ai.nexconn.chat:chat:26.4.2'
  // Official Nexconn Android Call SDK. There is no call 26.4.2; call 26.4.1 is the newest
  // release and its own POM depends on chat 26.4.2, so this is the vendor-paired version.
  implementation 'ai.nexconn.chat:call:26.4.1'
}
